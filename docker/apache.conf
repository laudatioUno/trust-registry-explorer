# Apache-Ergänzungen für den Trust Registry Explorer.
#
# storage/ liegt im Document Root, enthält aber nur Laufzeitdaten (SQLite-
# Datenbank, collect.log) — diese dürfen nie direkt ausgeliefert werden.
# Gleiches gilt für Dotfiles (.git, .gitignore, ...), die Docker-Dateien und
# collect.php (ausschliesslich für die CLI gedacht).
ServerName localhost
ServerTokens Prod
ServerSignature Off
DirectoryIndex index.php

<Directory /var/www/html/storage>
    Require all denied
</Directory>
<Directory /var/www/html/docker>
    Require all denied
</Directory>
<FilesMatch "^(\.|Dockerfile$|docker-compose\.ya?ml$|collect\.php$)">
    Require all denied
</FilesMatch>
